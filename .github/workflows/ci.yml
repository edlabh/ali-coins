name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Menor privilégio por padrão; jobs que precisam de mais permissão declaram localmente
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run linter
        run: npm run lint

      - name: Run code formatting check
        run: npm run format:check

      - name: Run native test suite with coverage threshold (>= 80%)
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.json 2>/dev/null || true
        continue-on-error: true

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: ignore
        continue-on-error: true

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  docker:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .dockerignore security patterns
        run: |
          set -euo pipefail
          required=(
            "credentials.env"
            "session*.json"
            "session*.enc"
            "*.enc"
            "session_meta*.json"
            "session_token*.txt"
            "accounts.json"
            "github_token.env"
          )
          for pattern in "${required[@]}"; do
            if ! grep -qxF "$pattern" .dockerignore; then
              echo "Padrão de segurança ausente no .dockerignore: $pattern"
              exit 1
            fi
          done

      - name: Build Docker image
        run: docker build -t ali-coins:ci .

      - name: Smoke test (dry-run sem arquivos reais)
        run: |
          set -euo pipefail
          # Segredo gerado em runtime (nunca literal no workflow, que é varrido pelo Gitleaks)
          SMOKE_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("base64"))')"
          docker run --rm \
            -e ALI_USER=ci@example.com \
            -e ALI_PASSWORD=ci_placeholder_password \
            -e SESSION_SECRET="$SMOKE_SECRET" \
            ali-coins:ci node all.js --dry-run --json > /tmp/dry-run.json
          node -e "const j=require('/tmp/dry-run.json'); if(!j.dryRun){process.exit(1)}; console.log('dry-run OK:', j.user)"

      - name: Smoke test (launch do headless shell)
        run: |
          docker run --rm --entrypoint node ali-coins:ci -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch({ headless: true, chromiumSandbox: false, args: ['--disable-dev-shm-usage'] });
              const p = await b.newPage();
              await p.setContent('<h1>docker-ok</h1>');
              console.log('launch OK:', await p.innerText('h1'));
              await b.close();
            })();
          "

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
