name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  # Permite testar/republicar uma tag existente manualmente (Actions > Release > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente (ex: v1.0.0-rc.1)'
        required: true
        type: string

# Menor privilégio por padrão; o job `release` eleva para write (criar/editar release).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate semver tag and package.json version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' não é semver válida (esperado X.Y.Z ou vX.Y.Z)."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag '$TAG' (versão $VERSION) diverge de package.json ($PKG_VERSION)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if printf '%s' "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6ec1 # v4.2.2
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const marker = "## [" + version + "]";
            const lines = fs.readFileSync("CHANGELOG.md", "utf-8").split("\n");
            const start = lines.findIndex((l) => l.startsWith(marker));
            if (start === -1) process.exit(0);
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].startsWith("## [")) { end = i; break; }
            }
            process.stdout.write(lines.slice(start + 1, end).join("\n").trim() + "\n");
          ' > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          TRIGGER_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TITLE="Release ${VERSION}"
          FLAGS=(--title "$TITLE")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi

          NOTES_FLAGS=()
          if [ "$HAS_NOTES" = "true" ]; then
            NOTES_FLAGS+=(--notes-file /tmp/release-notes.md)
          fi

          # Tag canônica: prefere a forma SEM "v" (padrão do projeto) quando ambas existem,
          # evitando que a release fique ancorada na tag cujo run terminou primeiro.
          TARGET_TAG="$TRIGGER_TAG"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            TARGET_TAG="$VERSION"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            TARGET_TAG="v${VERSION}"
          fi

          # Idempotente: reutiliza a release existente da mesma versão (tag com ou sem "v")
          EXISTING_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq ".[] | select(.tagName == \"${VERSION}\" or .tagName == \"v${VERSION}\") | .tagName" \
            | head -n 1)"

          if [ -n "$EXISTING_TAG" ] && [ "$EXISTING_TAG" != "$TARGET_TAG" ]; then
            echo "Reancorando release da tag ${EXISTING_TAG} para ${TARGET_TAG}..."
            gh release edit "$EXISTING_TAG" --repo "$GITHUB_REPOSITORY" --tag "$TARGET_TAG" \
              "${FLAGS[@]}" "${NOTES_FLAGS[@]}"
          elif [ -n "$EXISTING_TAG" ]; then
            echo "Atualizando release existente da tag ${EXISTING_TAG}..."
            gh release edit "$EXISTING_TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}" "${NOTES_FLAGS[@]}"
          elif [ "$HAS_NOTES" = "true" ]; then
            echo "Criando release para a tag ${TARGET_TAG} com notas do CHANGELOG..."
            gh release create "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              "${FLAGS[@]}" "${NOTES_FLAGS[@]}" || {
              echo "Release já criada por execução concorrente; atualizando ${TARGET_TAG}..."
              gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}" "${NOTES_FLAGS[@]}"
            }
          else
            echo "Criando release para a tag ${TARGET_TAG} com notas geradas pelo GitHub..."
            gh release create "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes "${FLAGS[@]}" || {
              echo "Release já criada por execução concorrente; atualizando ${TARGET_TAG}..."
              gh release edit "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
            }
          fi
